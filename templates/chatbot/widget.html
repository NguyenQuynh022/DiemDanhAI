<!-- EduPortal AI Chatbot Widget — gọi qua Flask proxy -->
<style>
#chat-fab {
    position:fixed; bottom:1.5rem; right:1.5rem; z-index:1000;
    width:56px; height:56px; border-radius:50%;
    background:linear-gradient(135deg,#3b82f6,#6366f1);
    border:none; cursor:pointer;
    box-shadow:0 4px 20px rgba(99,102,241,.45);
    display:flex; align-items:center; justify-content:center;
    font-size:1.4rem; transition:transform .2s,box-shadow .2s; color:#fff;
}
#chat-fab:hover { transform:scale(1.1); box-shadow:0 6px 28px rgba(99,102,241,.6); }
#chat-fab.open  { background:linear-gradient(135deg,#ef4444,#dc2626); }

#chat-window {
    position:fixed; bottom:5.5rem; right:1.5rem; z-index:999;
    width:380px; height:540px;
    background:#ffffff; border:1px solid #e2e8f0;
    border-radius:1rem; box-shadow:0 20px 60px rgba(0,0,0,.15);
    display:flex; flex-direction:column;
    animation:chatIn .25s cubic-bezier(.34,1.56,.64,1);
    overflow:hidden;
}
#chat-window.hidden { display:none; }
@keyframes chatIn {
    from{opacity:0;transform:scale(.92) translateY(12px)}
    to  {opacity:1;transform:scale(1)   translateY(0)}
}
.chat-header {
    background:linear-gradient(135deg,#1e1b4b,#312e81);
    padding:.875rem 1.1rem;
    display:flex; align-items:center; gap:.75rem; flex-shrink:0;
}
.chat-avatar {
    width:36px; height:36px; border-radius:50%;
    background:linear-gradient(135deg,#3b82f6,#6366f1);
    display:grid; place-items:center; font-size:1.1rem;
    border:2px solid rgba(255,255,255,.2); flex-shrink:0;
}
.chat-hname  { font-weight:700; font-size:.9rem; color:#fff; }
.chat-hsub   { font-size:.72rem; color:#a5b4fc; display:flex; align-items:center; gap:.3rem; }
.online-dot  { width:6px; height:6px; border-radius:50%; background:#22c55e; animation:blink 2s infinite; }
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.chat-close  {
    background:rgba(255,255,255,.12); border:none; color:#fff;
    width:28px; height:28px; border-radius:50%; cursor:pointer;
    font-size:.9rem; display:grid; place-items:center; margin-left:auto;
    transition:background .15s;
}
.chat-close:hover { background:rgba(255,255,255,.25); }

#chat-msgs {
    flex:1; overflow-y:auto; padding:1rem;
    display:flex; flex-direction:column; gap:.6rem;
    scroll-behavior:smooth;
}
#chat-msgs::-webkit-scrollbar { width:4px; }
#chat-msgs::-webkit-scrollbar-thumb { background:#e2e8f0; border-radius:2px; }

.cmsg { max-width:85%; animation:msgIn .2s ease; }
@keyframes msgIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.cmsg.user { align-self:flex-end; }
.cmsg.bot  { align-self:flex-start; }
.cbubble {
    padding:.6rem .875rem; border-radius:1rem;
    font-size:.855rem; line-height:1.55; word-break:break-word;
}
.cmsg.user .cbubble { background:#3b82f6; color:#fff; border-bottom-right-radius:.25rem; }
.cmsg.bot  .cbubble { background:#f1f5f9; color:#111827; border-bottom-left-radius:.25rem; border:1px solid #e2e8f0; }
.cmsg.error .cbubble { background:#fee2e2; color:#b91c1c; border:1px solid #fca5a5; }
.ctime { font-size:.68rem; color:#9ca3af; margin-top:.2rem; padding:0 .25rem; }
.cmsg.user .ctime { text-align:right; }

.typing { display:flex; gap:4px; padding:.6rem .875rem; }
.typing span {
    width:7px; height:7px; border-radius:50%; background:#94a3b8;
    animation:tdot .9s infinite;
}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

#quick-area { padding:0 .75rem .5rem; display:flex; gap:.4rem; flex-wrap:wrap; }
.qbtn {
    padding:.3rem .7rem; border-radius:99px;
    border:1px solid #c7d2fe; background:#eef2ff;
    color:#4338ca; font-size:.78rem; cursor:pointer; transition:all .15s;
}
.qbtn:hover { background:#4338ca; color:#fff; border-color:#4338ca; }

.chat-input-area {
    padding:.75rem; border-top:1px solid #f1f5f9;
    display:flex; gap:.5rem; align-items:flex-end; flex-shrink:0;
}
#chat-input {
    flex:1; padding:.6rem .875rem;
    border:1px solid #e2e8f0; border-radius:.6rem;
    font-family:inherit; font-size:.875rem; color:#111827;
    resize:none; outline:none; max-height:100px;
    transition:border-color .2s; line-height:1.4;
}
#chat-input:focus { border-color:#3b82f6; box-shadow:0 0 0 3px #3b82f620; }
#chat-send {
    width:38px; height:38px; border-radius:.5rem;
    background:linear-gradient(135deg,#3b82f6,#6366f1);
    border:none; color:#fff; cursor:pointer;
    display:grid; place-items:center; font-size:1rem;
    transition:opacity .15s; flex-shrink:0;
}
#chat-send:hover { opacity:.88; }
#chat-send:disabled { opacity:.4; cursor:not-allowed; }
</style>

<button id="chat-fab" onclick="chatToggle()" title="EduBot AI">🤖</button>

<div id="chat-window" class="hidden">
  <div class="chat-header">
    <div class="chat-avatar">🤖</div>
    <div style="flex:1;min-width:0">
      <div class="chat-hname">EduBot AI</div>
      <div class="chat-hsub"><span class="online-dot"></span>Trợ lý học tập thông minh</div>
    </div>
    <button class="chat-close" onclick="chatToggle()">✕</button>
  </div>

  <div id="chat-msgs"></div>
  <div id="quick-area"></div>

  <div class="chat-input-area">
    <textarea id="chat-input" rows="1"
      placeholder="Nhập câu hỏi..."
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();chatSend()}"
      oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'">
    </textarea>
    <button id="chat-send" onclick="chatSend()">➤</button>
  </div>
</div>

<script>
(function(){
  const ROLE = "{{ current_user.role }}";
  const NAME = "{{ current_user.full_name }}";
  let msgs    = [];   // conversation history [{role,content}]
  let isOpen  = false;
  let busy    = false;

  const QUICK = {
    student:  ["📊 Điểm của tôi?","📅 Lịch hôm nay?","✅ Chuyên cần của tôi?","🔔 Có thông báo mới không?"],
    lecturer: ["📚 Lịch dạy hôm nay?","👥 Sĩ số các lớp?","📊 Tỷ lệ chuyên cần?","📝 Cách nhập điểm?"],
  };

  const WELCOME = ROLE === 'student'
    ? `Xin chào **${NAME}**! 👋\nMình là EduBot — trợ lý AI của EduPortal.\nMình có thể giúp bạn tra điểm số, lịch học, tỷ lệ chuyên cần và nhiều hơn nữa. Bạn cần hỗ trợ gì?`
    : `Xin chào thầy/cô **${NAME}**! 👋\nMình là EduBot — trợ lý AI của EduPortal.\nMình có thể hỗ trợ thầy/cô về lớp học, điểm danh, điểm số và các tính năng hệ thống.`;

  function now(){
    return new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
  }

  function mdToHtml(t){
    return t
      .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.*?)\*/g,'<em>$1</em>')
      .replace(/`(.*?)`/g,'<code style="background:#f1f5f9;padding:.1rem .3rem;border-radius:.25rem;font-size:.82rem">$1</code>')
      .replace(/\n/g,'<br>');
  }

  function addMsg(role, text, isErr=false){
    const box = document.getElementById('chat-msgs');
    const d   = document.createElement('div');
    d.className = `cmsg ${isErr?'error':role}`;
    d.innerHTML = `<div class="cbubble">${mdToHtml(text)}</div><div class="ctime">${now()}</div>`;
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
  }

  function showTyping(){
    const box = document.getElementById('chat-msgs');
    const d   = document.createElement('div');
    d.className='cmsg bot'; d.id='chat-typing';
    d.innerHTML=`<div class="cbubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    box.appendChild(d); box.scrollTop=box.scrollHeight;
  }

  function hideTyping(){ document.getElementById('chat-typing')?.remove(); }

  // Check API status khi mở lần đầu
  async function checkApiStatus(){
    try{
      const res = await fetch('/chatbot/api/status');
      const d   = await res.json();
      if(!d.ready){
        const providerMap = {
          groq:      {label: 'Groq', key: 'GROQ_API_KEY', url: 'https://console.groq.com/keys'},
          anthropic: {label: 'Anthropic', key: 'ANTHROPIC_API_KEY', url: 'https://console.anthropic.com'},
          gemini:    {label: 'Gemini', key: 'GEMINI_API_KEY', url: 'https://aistudio.google.com/app/apikey'},
        };
        const info = providerMap[d.provider] || providerMap.anthropic;
        addMsg('bot',
          `⚙️ **Chatbot chưa được cấu hình API key cho ${info.label}.**\n\n`+
          'Mở file `.env` và thêm:\n'+
          `AI_PROVIDER=${d.provider}\n`+
          `\`${info.key}=your_${info.label.toLowerCase()}_api_key_here\``+ '\n\n' +
          `📌 Lấy key tại: **${info.url}**`,
          false
        );
        return false;
      }
      const badge = {groq:' Groq',anthropic:' Claude',gemini:' Gemini'}[d.provider]||'🟢 AI';
      document.querySelector('.chat-hsub').innerHTML =
        `<span class="online-dot"></span>${badge} · Sẵn sàng`;
      return true;
    }catch(e){ return true; }
  }

  function showQuick(){
    const area  = document.getElementById('quick-area');
    const items = (QUICK[ROLE]||[]);
    area.innerHTML='';
    items.forEach(q=>{
      const b=document.createElement('button');
      b.className='qbtn'; b.textContent=q;
      b.onclick=()=>{ area.innerHTML=''; chatSendText(q); };
      area.appendChild(b);
    });
  }

  async function chatSendText(text){
    if(!text.trim()||busy) return;
    busy=true;
    document.getElementById('chat-send').disabled=true;
    document.getElementById('quick-area').innerHTML='';

    addMsg('user', text);
    msgs.push({role:'user', content:text});
    showTyping();

    try {
      const res  = await fetch('/chatbot/api/chat',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({messages:msgs})
      });
      const data = await res.json();
      hideTyping();

      if(data.ok && data.reply){
        msgs.push({role:'assistant', content:data.reply});
        addMsg('bot', data.reply);
      } else {
        const errMsg = data.error||'Lỗi không xác định';
        addMsg('bot', '❌ '+errMsg, true);
        // Nếu lỗi API key, hướng dẫn luôn
        if(errMsg.includes('API key')||errMsg.includes('api_key')){
          setTimeout(()=>addMsg('bot',
            '🔧 Để sửa lỗi:\n'+
            '1. Mở file `.env`\n'+
            '2. Chọn AI_PROVIDER=groq hoặc AI_PROVIDER=anthropic\n'+
            '3. Thêm key tương ứng: `GROQ_API_KEY=...` hoặc `ANTHROPIC_API_KEY=...`\n'+
            '4. Restart Flask',
          ),400);
        }
      }
    } catch(e) {
      hideTyping();
      addMsg('bot','❌ Không thể kết nối server. Kiểm tra Flask đang chạy không?', true);
    }

    busy=false;
    document.getElementById('chat-send').disabled=false;
  }

  window.chatSend = function(){
    const inp = document.getElementById('chat-input');
    const t   = inp.value.trim();
    if(!t) return;
    inp.value=''; inp.style.height='auto';
    chatSendText(t);
  };

  window.chatToggle = function(){
    isOpen=!isOpen;
    const win=document.getElementById('chat-window');
    const fab=document.getElementById('chat-fab');
    if(isOpen){
      win.classList.remove('hidden');
      fab.classList.add('open'); fab.textContent='✕';
      if(msgs.length===0){ addMsg('bot',WELCOME); checkApiStatus().then(ok=>{ if(ok) showQuick(); }); }
      setTimeout(()=>document.getElementById('chat-input').focus(),150);
    } else {
      win.classList.add('hidden');
      fab.classList.remove('open'); fab.textContent='🤖';
    }
  };
})();
</script>
