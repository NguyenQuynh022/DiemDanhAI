<!-- EduPortal AI Chatbot Widget — Modern Floating Assistant -->
<style>
#chat-fab {
    position:fixed; bottom:1.5rem; right:1.5rem; z-index:1000;
    width:56px; height:56px; border-radius:16px;
    background:linear-gradient(135deg, var(--accent, #2563eb), var(--accent2, #4f46e5));
    border:none; cursor:pointer;
    box-shadow:0 8px 24px rgba(79,70,229,.42);
    display:flex; align-items:center; justify-content:center;
    font-size:1.45rem; transition:transform .2s, box-shadow .2s, border-radius .2s; color:#fff;
}
#chat-fab:hover { transform:translateY(-2px) scale(1.05); box-shadow:0 12px 28px rgba(79,70,229,.55); }
#chat-fab.open  { background:linear-gradient(135deg,#ef4444,#dc2626); border-radius:50%; }

#chat-window {
    position:fixed; bottom:5.5rem; right:1.5rem; z-index:999;
    width:390px; max-width:calc(100vw - 2rem); height:560px; max-height:calc(100vh - 7.5rem);
    background:#ffffff; border:1px solid #e2e8f0;
    border-radius:20px; box-shadow:0 24px 64px rgba(15,23,42,.18);
    display:flex; flex-direction:column;
    animation:chatIn .25s cubic-bezier(.16,1,.3,1);
    overflow:hidden;
}
#chat-window.hidden { display:none; }
@keyframes chatIn {
    from{opacity:0;transform:scale(.94) translateY(14px)}
    to  {opacity:1;transform:scale(1)   translateY(0)}
}
.chat-header {
    background:var(--hero-gradient, linear-gradient(135deg,#0f172a,#2563eb));
    padding:1rem 1.15rem;
    display:flex; align-items:center; gap:.75rem; flex-shrink:0;
}
.chat-avatar {
    width:38px; height:38px; border-radius:12px;
    background:rgba(255,255,255,.16);
    display:grid; place-items:center; font-size:1.15rem;
    border:1px solid rgba(255,255,255,.25); flex-shrink:0;
}
.chat-hname  { font-family:var(--head, sans-serif); font-weight:700; font-size:.92rem; color:#fff; }
.chat-hsub   { font-size:.73rem; color:rgba(255,255,255,.8); display:flex; align-items:center; gap:.35rem; margin-top:1px; }
.online-dot  { width:7px; height:7px; border-radius:50%; background:#4ade80; box-shadow:0 0 8px #4ade80; animation:blink 2s infinite; }
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.chat-close  {
    background:rgba(255,255,255,.14); border:none; color:#fff;
    width:30px; height:30px; border-radius:8px; cursor:pointer;
    font-size:.9rem; display:grid; place-items:center; margin-left:auto;
    transition:background .15s;
}
.chat-close:hover { background:rgba(255,255,255,.28); }

#chat-msgs {
    flex:1; overflow-y:auto; padding:1rem 1.1rem;
    background:#f8fafc;
    display:flex; flex-direction:column; gap:.7rem;
    scroll-behavior:smooth;
}
#chat-msgs::-webkit-scrollbar { width:4px; }
#chat-msgs::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:2px; }

.cmsg { max-width:86%; animation:msgIn .2s ease; }
@keyframes msgIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.cmsg.user { align-self:flex-end; }
.cmsg.bot  { align-self:flex-start; }
.cbubble {
    padding:.68rem .95rem; border-radius:14px;
    font-size:.86rem; line-height:1.55; word-break:break-word;
    box-shadow:0 1px 2px rgba(15,23,42,.04);
}
.cmsg.user .cbubble {
    background:linear-gradient(135deg, var(--accent, #2563eb), var(--accent2, #4f46e5));
    color:#fff; border-bottom-right-radius:4px;
}
.cmsg.bot  .cbubble { background:#ffffff; color:#0f172a; border-bottom-left-radius:4px; border:1px solid #e2e8f0; }
.cmsg.error .cbubble { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; }
.ctime { font-size:.67rem; color:#94a3b8; margin-top:.22rem; padding:0 .25rem; }
.cmsg.user .ctime { text-align:right; }

.typing { display:flex; gap:4px; padding:.45rem .6rem; }
.typing span {
    width:7px; height:7px; border-radius:50%; background:#94a3b8;
    animation:tdot .9s infinite;
}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

#quick-area { padding:.5rem .85rem; background:#f8fafc; display:flex; gap:.4rem; flex-wrap:wrap; border-top:1px solid #f1f5f9; }
#quick-area:empty { display:none; }
.qbtn {
    padding:.35rem .75rem; border-radius:99px;
    border:1px solid var(--accent-border, #bfdbfe); background:var(--accent-soft, #eff6ff);
    color:var(--accent-text, #1d4ed8); font-size:.77rem; font-weight:600; cursor:pointer; transition:all .15s;
}
.qbtn:hover { background:var(--accent, #2563eb); color:#fff; border-color:var(--accent, #2563eb); }

.chat-input-area {
    padding:.75rem .85rem; background:#ffffff; border-top:1px solid #e2e8f0;
    display:flex; gap:.5rem; align-items:flex-end; flex-shrink:0;
}
#chat-input {
    flex:1; padding:.62rem .875rem;
    background:#f8fafc;
    border:1px solid #cbd5e1; border-radius:10px;
    font-family:inherit; font-size:.875rem; color:#0f172a;
    resize:none; outline:none; max-height:100px;
    transition:border-color .2s, background .2s; line-height:1.4;
}
#chat-input:focus { background:#fff; border-color:var(--accent, #2563eb); box-shadow:0 0 0 3px rgba(37,99,235,.12); }
#chat-send {
    width:40px; height:40px; border-radius:10px;
    background:linear-gradient(135deg, var(--accent, #2563eb), var(--accent2, #4f46e5));
    border:none; color:#fff; cursor:pointer;
    display:grid; place-items:center; font-size:1rem;
    transition:opacity .15s, transform .15s; flex-shrink:0;
}
#chat-send:hover { opacity:.92; transform:translateY(-1px); }
#chat-send:disabled { opacity:.4; cursor:not-allowed; transform:none; }
</style>

<button id="chat-fab" onclick="chatToggle()" title="Trợ lý EduBot AI">🤖</button>

<div id="chat-window" class="hidden">
  <div class="chat-header">
    <div class="chat-avatar">🤖</div>
    <div style="flex:1;min-width:0">
      <div class="chat-hname">EduBot AI</div>
      <div class="chat-hsub"><span class="online-dot"></span>Trợ lý học vụ thông minh</div>
    </div>
    <button class="chat-close" onclick="chatToggle()">✕</button>
  </div>

  <div id="chat-msgs"></div>
  <div id="quick-area"></div>

  <div class="chat-input-area">
    <textarea id="chat-input" rows="1"
      placeholder="Hỏi về lịch học, điểm số, chuyên cần..."
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();chatSend()}"
      oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'"></textarea>
    <button id="chat-send" onclick="chatSend()">➤</button>
  </div>
</div>

<script>
(function(){
  const ROLE = "{{ current_user.role }}";
  const NAME = "{{ current_user.full_name }}";
  let msgs    = [];
  let isOpen  = false;
  let busy    = false;

  const QUICK = {
    student:  ["📊 Điểm của tôi?","📅 Lịch hôm nay?","✅ Chuyên cần của tôi?","🔔 Có thông báo mới không?"],
    lecturer: ["📚 Lịch dạy hôm nay?","👥 Sĩ số các lớp?","📊 Tỷ lệ chuyên cần?","📝 Cách nhập điểm?"],
  };

  const WELCOME = ROLE === 'student'
    ? `Xin chào **${NAME}**! 👋\nMình là **EduBot** — trợ lý AI cá nhân của bạn trên EduPortal.\nMình có thể tra cứu nhanh điểm số, GPA, lịch học hôm nay và tỷ lệ chuyên cần. Bạn muốn hỏi gì nào?`
    : `Xin chào thầy/cô **${NAME}**! 👋\nMình là **EduBot** — trợ lý AI giảng dạy của EduPortal.\nMình có thể hỗ trợ tra cứu lịch giảng hôm nay, sĩ số lớp và tình hình chuyên cần.`;

  function now(){
    return new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
  }

  function mdToHtml(t){
    return t
      .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.*?)\*/g,'<em>$1</em>')
      .replace(/`(.*?)`/g,'<code style="background:#f1f5f9;padding:.1rem .35rem;border-radius:.25rem;font-size:.82rem">$1</code>')
      .replace(/\n/g,'<br>');
  }

  function addMsg(role, text, isErr=false){
    const box = document.getElementById('chat-msgs');
    const d   = document.createElement('div');
    d.className = `cmsg ${isErr?'error':role}`;
    d.innerHTML = `<div class="cbubble">${mdToHtml(text)}</div><div class="ctime">${now()}</div>`;
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
  }

  function showTyping(){
    const box = document.getElementById('chat-msgs');
    const d   = document.createElement('div');
    d.className='cmsg bot'; d.id='chat-typing';
    d.innerHTML=`<div class="cbubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    box.appendChild(d); box.scrollTop=box.scrollHeight;
  }

  function hideTyping(){ document.getElementById('chat-typing')?.remove(); }

  async function checkApiStatus(){
    try{
      const res = await fetch('/chatbot/api/status');
      const d   = await res.json();
      if(!d.ready){
        const providerMap = {
          groq:      {label: 'Groq', key: 'GROQ_API_KEY', url: 'https://console.groq.com/keys'},
          anthropic: {label: 'Anthropic', key: 'ANTHROPIC_API_KEY', url: 'https://console.anthropic.com'},
          gemini:    {label: 'Gemini', key: 'GEMINI_API_KEY', url: 'https://aistudio.google.com/app/apikey'},
        };
        const info = providerMap[d.provider] || providerMap.anthropic;
        addMsg('bot',
          `⚙️ **Chatbot chưa được cấu hình API key cho ${info.label}.**\n\n`+
          'Mở file `.env` và thêm:\n'+
          `AI_PROVIDER=${d.provider}\n`+
          `\`${info.key}=your_${info.label.toLowerCase()}_api_key_here\``+ '\n\n' +
          `📌 Lấy key tại: **${info.url}**`,
          false
        );
        return false;
      }
      const badge = {groq:'Groq AI',anthropic:'Claude AI',gemini:'Gemini AI'}[d.provider]||'AI';
      document.querySelector('.chat-hsub').innerHTML =
        `<span class="online-dot"></span>${badge} · Đang trực tuyến`;
      return true;
    }catch(e){ return true; }
  }

  function showQuick(){
    const area  = document.getElementById('quick-area');
    const items = (QUICK[ROLE]||[]);
    area.innerHTML='';
    items.forEach(q=>{
      const b=document.createElement('button');
      b.className='qbtn'; b.textContent=q;
      b.onclick=()=>{ area.innerHTML=''; chatSendText(q); };
      area.appendChild(b);
    });
  }

  async function chatSendText(text){
    if(!text.trim()||busy) return;
    busy=true;
    document.getElementById('chat-send').disabled=true;
    document.getElementById('quick-area').innerHTML='';

    addMsg('user', text);
    msgs.push({role:'user', content:text});
    showTyping();

    try {
      const res  = await fetch('/chatbot/api/chat',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({messages:msgs})
      });
      const data = await res.json();
      hideTyping();

      if(data.ok && data.reply){
        msgs.push({role:'assistant', content:data.reply});
        addMsg('bot', data.reply);
      } else {
        const errMsg = data.error||'Lỗi không xác định';
        addMsg('bot', '❌ '+errMsg, true);
      }
    } catch(e) {
      hideTyping();
      addMsg('bot','❌ Không thể kết nối máy chủ. Vui lòng kiểm tra kết nối mạng.', true);
    }

    busy=false;
    document.getElementById('chat-send').disabled=false;
  }

  window.chatSend = function(){
    const inp = document.getElementById('chat-input');
    const t   = inp.value.trim();
    if(!t) return;
    inp.value=''; inp.style.height='auto';
    chatSendText(t);
  };

  window.chatToggle = function(){
    isOpen=!isOpen;
    const win=document.getElementById('chat-window');
    const fab=document.getElementById('chat-fab');
    if(isOpen){
      win.classList.remove('hidden');
      fab.classList.add('open'); fab.textContent='✕';
      if(msgs.length===0){ addMsg('bot',WELCOME); checkApiStatus().then(ok=>{ if(ok) showQuick(); }); }
      setTimeout(()=>document.getElementById('chat-input').focus(),150);
    } else {
      win.classList.add('hidden');
      fab.classList.remove('open'); fab.textContent='🤖';
    }
  };
})();
</script>
